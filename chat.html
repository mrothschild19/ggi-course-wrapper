<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGI — Chat With Us</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:transparent;}
  .ggi-fab{position:fixed;bottom:22px;right:22px;z-index:99999;
    background:#1A45A3;color:#fff;border:0;border-radius:50px;cursor:pointer;
    padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(26,69,163,.4);
    display:flex;align-items:center;gap:9px;transition:transform .15s,filter .15s;}
  .ggi-fab:hover{transform:translateY(-2px);filter:brightness(1.08);}
  .ggi-fab .dot{width:9px;height:9px;border-radius:50%;background:#7CE38B;box-shadow:0 0 0 3px rgba(124,227,139,.3);}
  .ggi-chat{position:fixed;bottom:22px;right:22px;z-index:99999;width:380px;max-width:calc(100vw - 32px);
    height:560px;max-height:calc(100vh - 44px);background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 14px 50px rgba(0,0,0,.28);display:none;flex-direction:column;border:1px solid #D3DEF2;}
  .ggi-chat.open{display:flex;}
  .ggi-head{background:linear-gradient(180deg,#1A45A3,#123379);color:#fff;padding:15px 18px;
    border-bottom:3px solid #D9A41E;display:flex;align-items:center;justify-content:space-between;}
  .ggi-head-l{display:flex;align-items:center;gap:11px;}
  .ggi-head img{width:38px;height:38px;border-radius:8px;background:#fff;padding:3px;object-fit:contain;}
  .ggi-head-t b{font-family:Georgia,serif;font-size:15px;display:block;}
  .ggi-head-t span{font-size:11.5px;color:#D9A41E;}
  .ggi-close{background:none;border:0;color:#D3DEF2;font-size:24px;cursor:pointer;line-height:1;}
  .ggi-close:hover{color:#fff;}
  .ggi-log{flex:1;overflow-y:auto;padding:16px;background:#F4F7FD;}
  .msg{margin-bottom:12px;display:flex;}
  .msg.bot{justify-content:flex-start;}
  .msg.me{justify-content:flex-end;}
  .bub{max-width:80%;padding:10px 13px;border-radius:13px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .bot .bub{background:#fff;border:1px solid #D3DEF2;color:#22314A;border-bottom-left-radius:4px;}
  .me .bub{background:#1A45A3;color:#fff;border-bottom-right-radius:4px;}
  .typing .bub{color:#7184A0;font-style:italic;}
  .ggi-foot{padding:12px;border-top:1px solid #D3DEF2;background:#fff;}
  .ggi-row{display:flex;gap:8px;}
  .ggi-input{flex:1;border:1px solid #D3DEF2;border-radius:10px;padding:11px;font-size:14px;
    font-family:inherit;resize:none;color:#22314A;max-height:90px;}
  .ggi-input:focus{outline:none;border-color:#D9A41E;}
  .ggi-send{background:#1A45A3;color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:700;
    font-size:14px;cursor:pointer;transition:filter .15s;}
  .ggi-send:hover{filter:brightness(1.12);}
  .ggi-send:disabled{opacity:.55;cursor:wait;}
  .ggi-note{font-size:10.5px;color:#7184A0;text-align:center;margin-top:8px;line-height:1.35;}
</style>
</head>
<body>
<button class="ggi-fab" id="ggiFab" onclick="ggiOpen()"><span class="dot"></span> Chat with us</button>
<div class="ggi-chat" id="ggiChat">
  <div class="ggi-head">
    <div class="ggi-head-l">
      <img src="https://media.base44.com/images/public/6a1efd8efa1513ab48247266/66f4809cf_FINALGlobalGriefInstituteLOGO1.png" alt="GGI">
      <div class="ggi-head-t"><b>Global Grief Institute</b><span>Ask us about our programs</span></div>
    </div>
    <button class="ggi-close" onclick="ggiClose()">&times;</button>
  </div>
  <div class="ggi-log" id="ggiLog">
    <div class="msg bot"><div class="bub">Hi! &#128075; I'm Tailor, the GGI assistant. Curious about our coaching certifications, pricing, or which program fits you? Ask me anything.</div></div>
  </div>
  <div class="ggi-foot">
    <div class="ggi-row">
      <textarea class="ggi-input" id="ggiInput" rows="1" placeholder="Type your question..." onkeydown="ggiKey(event)"></textarea>
      <button class="ggi-send" id="ggiSend" onclick="ggiAsk()">Send</button>
    </div>
    <div class="ggi-note">AI assistant for general guidance &mdash; not medical, legal, or crisis support. In crisis? Call or text 988.</div>
  </div>
</div>
<script>
  var GGI_ASK_URL = "https://6a1efd8efa1513ab48247266.base44.app/api/apps/6a1efd8efa1513ab48247266/functions/askClaude";
  function ggiOpen(){document.getElementById('ggiChat').classList.add('open');document.getElementById('ggiFab').style.display='none';document.getElementById('ggiInput').focus();}
  function ggiClose(){document.getElementById('ggiChat').classList.remove('open');document.getElementById('ggiFab').style.display='flex';}
  function ggiKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ggiAsk();}}
  function addMsg(role,text,cls){
    var log=document.getElementById('ggiLog');
    var m=document.createElement('div');m.className='msg '+role+(cls?' '+cls:'');
    var b=document.createElement('div');b.className='bub';b.textContent=text;
    m.appendChild(b);log.appendChild(m);log.scrollTop=log.scrollHeight;return m;
  }
  function ggiAsk(){
    var inp=document.getElementById('ggiInput'), btn=document.getElementById('ggiSend');
    var q=(inp.value||'').trim(); if(!q){inp.focus();return;}
    addMsg('me',q); inp.value='';
    btn.disabled=true; btn.textContent='...';
    var typing=addMsg('bot','Tailor is typing...','typing');
    fetch(GGI_ASK_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,lesson:'website inquiry from a prospective client'})
    }).then(function(r){return r.json();}).then(function(d){
      typing.remove();
      addMsg('bot', d.answer || (d.error?('Sorry - '+d.error):'Sorry, no answer came back.'));
    }).catch(function(){
      typing.remove();
      addMsg('bot','Sorry - something went wrong. Please try again or email info@globalgriefinstitute.com.');
    }).finally(function(){btn.disabled=false;btn.textContent='Send';});
  }
</script>
</body>
</html>
