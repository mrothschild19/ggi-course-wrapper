<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Global Grief Institute — Course Library</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A45A3;--navy-dark:#112d7a;--gold:#D9A41E;
  --bg:#F4F7FD;--border:#D3DEF2;--text:#22314A;--muted:#7184A0;
}
html,body{height:100%;font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* TOP BAR */
.topbar{display:flex;align-items:center;gap:14px;padding:0 20px;height:62px;background:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:200;flex-wrap:wrap}
.logo{height:40px;width:40px;object-fit:contain;border-radius:50%}
.brandtext .acad{font-size:15px;font-weight:800;color:var(--navy)}
.brandtext .tag{font-size:11px;color:var(--muted)}
.votd{flex:1;display:flex;flex-direction:column;align-items:flex-end}
.votd-label{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.votd-text{font-size:11px;font-style:italic;color:var(--navy);max-width:300px;text-align:right;line-height:1.4}
.votd-ref{font-size:10px;color:var(--muted)}

/* LAYOUT */
.lms-body{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 62px);overflow:hidden}

/* SIDEBAR */
.sidebar{background:#fff;border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);background:var(--bg)}
.sidebar-header h2{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:10px}
.search{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);outline:none}
.search:focus{border-color:var(--navy)}
.course-count{font-size:11px;color:var(--muted);margin-top:6px}
.course-list{flex:1;overflow-y:auto;padding:8px 0}
.course-item{padding:12px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;border-bottom:1px solid var(--border)}
.course-item:hover{background:var(--bg);border-left-color:var(--gold)}
.course-item.active{background:rgba(26,69,163,.06);border-left-color:var(--navy)}
.course-item.active .ci-title{color:var(--navy);font-weight:800}
.ci-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:3px}
.ci-sub{font-size:11px;color:var(--muted)}
.ci-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:3px;margin-top:4px;text-transform:uppercase}
.badge-live{background:#e8f5e9;color:#2e7d32}
.badge-soon{background:#fff8e1;color:#f57f17}

/* MAIN */
.main{overflow-y:auto;display:flex;flex-direction:column;background:var(--bg)}
.course-header{padding:20px 24px 16px;background:#fff;border-bottom:1px solid var(--border)}
.course-header-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:10px}
.ch-icon{width:48px;height:48px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ch-title{font-size:20px;font-weight:800;color:var(--navy);line-height:1.2;margin-bottom:4px}
.ch-sub{font-size:13px;color:var(--muted)}
.frame-wrap{flex:1;padding:20px 24px}
.gamma-frame{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;height:calc(100vh - 230px);min-height:400px}
.gamma-frame iframe{width:100%;height:100%;border:none;display:block}
.placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;text-align:center;padding:30px}
.ph-icon{font-size:56px}
.ph-title{font-size:18px;font-weight:800;color:var(--navy)}
.ph-sub{font-size:13px;max-width:340px;line-height:1.7;color:var(--muted)}
.ph-id{font-size:11px;background:#eef2fa;padding:4px 10px;border-radius:4px;color:var(--navy);font-family:monospace}
.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:16px}
.w-logo{height:70px;width:70px;object-fit:contain;border-radius:50%;margin-bottom:8px}
.w-title{font-size:24px;font-weight:800;color:var(--navy)}
.w-sub{font-size:14px;color:var(--muted);max-width:360px;line-height:1.7}
.w-arrow{font-size:13px;color:var(--gold);font-weight:700}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#D3DEF2;border-radius:4px}
@media(max-width:700px){.lms-body{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>

<header class="topbar">
  <img class="logo" src="https://media.base44.com/images/public/6a1efd8efa1513ab48247266/66f4809cf_FINALGlobalGriefInstituteLOGO1.png" alt="GGI"/>
  <div class="brandtext">
    <div class="acad">Global Grief Institute</div>
    <div class="tag">Grief Care Certification Programs</div>
  </div>
  <div class="votd">
    <span class="votd-label">✨ Verse of the Day</span>
    <span class="votd-text" id="votdText">Loading…</span>
    <span class="votd-ref" id="votdRef"></span>
  </div>
</header>

<div class="lms-body">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>📚 Course Library</h2>
      <input class="search" type="text" placeholder="Search courses…" oninput="filterCourses(this.value)"/>
      <div class="course-count" id="courseCount"></div>
    </div>
    <div class="course-list" id="courseList"></div>
  </aside>

  <main class="main" id="mainPanel">
    <div class="frame-wrap">
      <div class="gamma-frame">
        <div class="welcome">
          <img class="w-logo" src="https://media.base44.com/images/public/6a1efd8efa1513ab48247266/66f4809cf_FINALGlobalGriefInstituteLOGO1.png" alt="GGI"/>
          <div class="w-title">Welcome to GGI</div>
          <div class="w-sub">Select a course from the left to begin. Your certification journey starts here.</div>
          <div class="w-arrow">← Choose a course to get started</div>
        </div>
      </div>
    </div>
  </main>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  GGI COURSE LIBRARY — LMS WRAPPER
//
//  TO ADD A GAMMA EMBED URL FOR A COURSE:
//  Find the course by its "id" below and paste your
//  Gamma embed URL into the "gammaUrl" field.
//
//  Example:
//  {"id":"igc-c1", ..., "gammaUrl":"https://gamma.app/embed/YOURCODE"}
//
//  GET THE URL FROM GAMMA:
//  Share → Embed → copy the src="..." value from the iframe code
// ═══════════════════════════════════════════════════════════════

urse/cmpwm08hq01hq04k3qrua2am0/learn"},{"id":"ggi-support-connect","title":"Support & Connection: You Are Not Alone","subtitle":"GGI Short Course","gammaUrl":"https://app.mindsmith.ai/course/cmpv84ker01tg04js2rxedrxt/learn"},{"id":"ggi-loss-changes","title":"When Loss Changes Everything","subtitle":"GGI Grief Specialty Course","gammaUrl":"https://app.mindsmith.ai/course/cmpso6qew00na04l2xuravdvd/learn"},{"id":"ggi-on-suicide","title":"On Suicide","subtitle":"GGI Crisis & Safety Course","gammaUrl":"https://app.mindsmith.ai/course/cmprend29005b04joyunbnh8z/learn"},{"id":"ggi-infant-death","title":"Infant Death & Sudden Widowhood","subtitle":"GGI Grief Specialty Course","gammaUrl":"https://gamma.app/embed/stuxzfi2os63brg"},{"id":"ggi-ptsd","title":"Understanding PTSD","subtitle":"Trauma & Recovery Track","gammaUrl":"https://gamma.app/embed/ox88i5wql9ni70t"},{"id":"ggi-healing-children","title":"Healing Traumatized Children","subtitle":"GGI Specialty Course","gammaUrl":""},{"id":"igc-c1","title":"Introduction to Grief Coaching \u2014 Course 1 of 5","subtitle":"Intro to Grief Coaching Track","gammaUrl":"https://gamma.app/embed/84ky0euok49tlxp"},{"id":"igc-c2","title":"Introduction to Grief Coaching \u2014 Course 2 of 5","subtitle":"Intro to Grief Coaching Track","gammaUrl":""},{"id":"igc-c3","title":"Introduction to Grief Coaching \u2014 Course 3 of 5","subtitle":"Intro to Grief Coaching Track","gammaUrl":""},{"id":"igc-c4","title":"Introduction to Grief Coaching \u2014 Course 4 of 5","subtitle":"Intro to Grief Coaching Track","gammaUrl":""},{"id":"igc-c5","title":"Introduction to Grief Coaching \u2014 Course 5 of 5","subtitle":"Intro to Grief Coaching Track","gammaUrl":""},{"id":"ggi-hard-deaths","title":"Hard Deaths","subtitle":"GGI Grief Specialty Course","gammaUrl":"https://gamma.app/embed/gw5f1nni548c1ae"},{"id":"ggi-sacred-conv","title":"Sacred Conversations","subtitle":"GGI Ministry Course","gammaUrl":"https://gamma.app/embed/vkd3ec2yi3z9wth"},{"id":"ggi-last-breath","title":"After the Last Breath","subtitle":"GGI End-of-Life Course","gammaUrl":"https://gamma.app/embed/ri6pvo2dyrddndn"},{"id":"ggi-god-grief","title":"God and Grief","subtitle":"GGI Faith & Grief Course","gammaUrl":"https://gamma.app/embed/raghucks2cha78x"},{"id":"ggi-beauty-ashes","title":"Beauty from Ashes","subtitle":"GGI Healing Course","gammaUrl":"https://gamma.app/embed/emgb2jwt8y4soea"},{"id":"ggi-carrying-remains","title":"Carrying What Remains","subtitle":"GGI Grief Course","gammaUrl":"https://gamma.app/embed/41o5bzdtd80r8j9"},{"id":"ggi-100-days","title":"100 Days","subtitle":"GGI Short Course","gammaUrl":"https://gamma.app/embed/f5ztmzj914ioakq"},{"id":"ggi-grieving-together","title":"Grieving Together, Apart","subtitle":"GGI Community Grief Course","gammaUrl":"https://gamma.app/embed/79eu8lqwn4fpyrv"},{"id":"ggi-god-far-1","title":"When God Feels Far \u2014 Part 1 of 2","subtitle":"GGI Faith & Doubt Course","gammaUrl":"https://gamma.app/embed/2sl2z6rh2t3pxtp"},{"id":"ggi-god-far-2","title":"When God Feels Far \u2014 Part 2 of 2","subtitle":"GGI Faith & Doubt Course","gammaUrl":"https://gamma.app/embed/s6z9f6fhz1p4j6r"},{"id":"ggi-body-remembers","title":"The Body Remembers","subtitle":"Somatic Grief & Trauma Track","gammaUrl":"https://gamma.app/embed/twjx2986j5x52nu"},{"id":"ggi-hard-losses","title":"The Hard Losses","subtitle":"GGI Grief Specialty Course","gammaUrl":"https://gamma.app/embed/7o0qfg6cc2yzbbs"},{"id":"ggi-threshold-vigil","title":"The Threshold Vigil","subtitle":"GGI End-of-Life Course","gammaUrl":"https://gamma.app/embed/4qfbrq0e5ho6l9d"},{"id":"ggi-dying-coach","title":"The Dying Person's Coach / Death Doula","subtitle":"GGI End-of-Life Certification","gammaUrl":"https://gamma.app/embed/g5s3fexcn2ifsip"},{"id":"ggi-attachment-trauma","title":"Attachment and Relational Trauma","subtitle":"GGI Specialty Course","gammaUrl":"https://gamma.app/embed/qmrukju6zztswjm"},{"id":"ggi-gen-trauma","title":"Generational Trauma","subtitle":"GGI Specialty Course","gammaUrl":"https://gamma.app/embed/epr52k0tag0aah3"},{"id":"ggi-launch-biz","title":"Launching Your Own Coaching Business","subtitle":"Healing By Grace \u2014 Business Track","gammaUrl":"https://gamma.app/embed/zmi3x2y6srvysbe"},{"id":"ggi-brand-biz","title":"Branding Your Coaching Business","subtitle":"Healing By Grace \u2014 Business Track","gammaUrl":"https://gamma.app/embed/5qwtctxtt3draek"},{"id":"ggi-legalities","title":"Legalities of the Grief Business","subtitle":"Healing By Grace \u2014 Business Track","gammaUrl":"https://gamma.app/embed/qd4ykj3bq2e8pc8"},{"id":"ggi-sudden-widowhood","title":"Sudden Widowhood: Grief, Courage, Faith & Rebuilding Life","subtitle":"GGI Grief Specialty Course","gammaUrl":"https://app.mindsmith.ai/course/cmpu2x8au02k804leya7fagjh/learn"}];

const VERSES=[
  {t:"He heals the brokenhearted and binds up their wounds.",r:"Psalm 147:3"},
  {t:"Blessed are those who mourn, for they will be comforted.",r:"Matthew 5:4"},
  {t:"The Lord is close to the brokenhearted.",r:"Psalm 34:18"},
  {t:"Cast all your anxiety on him because he cares for you.",r:"1 Peter 5:7"},
  {t:"Weeping may stay for the night, but rejoicing comes in the morning.",r:"Psalm 30:5"},
  {t:"Come to me, all who are weary and burdened, and I will give you rest.",r:"Matthew 11:28"},
  {t:"He will wipe every tear from their eyes.",r:"Revelation 21:4"},
  {t:"Mourn with those who mourn.",r:"Romans 12:15"},
  {t:"The Spirit of the Lord has anointed me to bind up the brokenhearted.",r:"Isaiah 61:1"},
  {t:"Even in darkness light dawns for the upright.",r:"Psalm 112:4"},
];

const ICONS={
  "cgcm":"🎓","igc":"📖","ggi-trauma":"🧠","ggi-on-suicide":"🆘",
  "ggi-dying":"🕊️","ggi-god":"✝️","ggi-finances":"💼","ggi-launch":"🚀",
  "ggi-brand":"🎨","ggi-legal":"⚖️","default":"📚"
};

function getIcon(id){
  for(const k in ICONS){if(id.startsWith(k))return ICONS[k];}
  return ICONS.default;
}

let activeCourse=null;
let allCourses=[...COURSES];

function init(){
  const d=new Date();
  const v=VERSES[(d.getFullYear()*366+d.getMonth()*31+d.getDate())%VERSES.length];
  document.getElementById("votdText").textContent='"'+v.t+'"';
  document.getElementById("votdRef").textContent="— "+v.r+" (NIV)";
  renderList(COURSES);
}

function renderList(list){
  const el=document.getElementById("courseList");
  el.innerHTML="";
  document.getElementById("courseCount").textContent=list.length+" courses";
  list.forEach(c=>{
    const div=document.createElement("div");
    div.className="course-item"+(activeCourse&&activeCourse.id===c.id?" active":"");
    div.onclick=()=>loadCourse(c);
    const live=c.gammaUrl&&c.gammaUrl.trim();
    div.innerHTML=
      '<div class="ci-title">'+c.title+'</div>'+
      '<div class="ci-sub">'+c.subtitle+'</div>'+
      '<span class="ci-badge '+( live?"badge-live":"badge-soon")+'">'+
      (live?"▶ Available":"Coming Soon")+'</span>';
    el.appendChild(div);
  });
}

function filterCourses(q){
  const filtered=COURSES.filter(c=>
    c.title.toLowerCase().includes(q.toLowerCase())||
    c.subtitle.toLowerCase().includes(q.toLowerCase())
  );
  renderList(filtered);
}

function loadCourse(c){
  activeCourse=c;
  renderList(COURSES.filter(x=>{
    const q=document.querySelector(".search").value;
    return !q||x.title.toLowerCase().includes(q.toLowerCase())||x.subtitle.toLowerCase().includes(q.toLowerCase());
  }));
  const main=document.getElementById("mainPanel");
  const icon=getIcon(c.id);
  const frameContent=c.gammaUrl&&c.gammaUrl.trim()
    ?'<iframe src="'+c.gammaUrl+'" allow="fullscreen; microphone" loading="lazy" style="width:100%;height:100%;border:none;display:block"></iframe>'
    :'<div class="placeholder"><div class="ph-icon">'+icon+'</div><div class="ph-title">'+c.title+'</div><div class="ph-sub">This course is coming soon. Your instructor will notify you when it becomes available.</div><div class="ph-id">'+c.id+'</div></div>';

  main.innerHTML=
    '<div class="course-header">'+
      '<div class="course-header-top">'+
        '<div class="ch-icon">'+icon+'</div>'+
        '<div><div class="ch-title">'+c.title+'</div><div class="ch-sub">'+c.subtitle+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="frame-wrap"><div class="gamma-frame">'+frameContent+'</div></div>';
}

init();
</script>
</body>
</html>
